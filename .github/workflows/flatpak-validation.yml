name: Cat Fork Flatpak validation

on:
  push:
    branches: [ci/linux-ffmpeg-drift-20261125]
    paths:
      - .github/workflows/flatpak-validation.yml
      - scripts/packaging/flatpak-validation/**
  workflow_dispatch:

permissions:
  actions: read
  contents: read

env:
  APP_ID: io.github.drunkenQCat.MAW.PlatformValidation
  PLATFORM_BRANCH: '26.08'
  FLATHUB: https://dl.flathub.org/repo/flathub.flatpakrepo

jobs:
  build:
    if: github.repository == 'drunkenQCat/moys-asr-workflow' && github.ref_name == 'ci/linux-ffmpeg-drift-20261125'
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Download verified AppImage payload
        uses: actions/download-artifact@v7
        with:
          artifact-ids: '15029231996'
          run-id: '45625061279'
          github-token: ${{ github.token }}
          path: input
      - name: Install Flatpak build tools and runtime
        run: |
          sudo apt-get update -q
          sudo apt-get install -y flatpak
          flatpak remote-add --user --if-not-exists flathub "$FLATHUB"
          flatpak install --user -y flathub "org.freedesktop.Platform//$PLATFORM_BRANCH" "org.freedesktop.Sdk//$PLATFORM_BRANCH"
      - name: Export Flatpak validation bundle
        run: |
          set -euo pipefail
          mapfile -t images < <(find input -type f -name '*.AppImage')
          test "${#images[@]}" -eq 1
          chmod +x "${images[0]}"
          "${images[0]}" --appimage-extract >/dev/null
          flatpak build-init stage "$APP_ID" org.freedesktop.Sdk org.freedesktop.Platform "$PLATFORM_BRANCH"
          mkdir -p stage/files/bin stage/files/python stage/files/maw
          tar -C squashfs-root --exclude=./ffmpeg -cf - . | tar -C stage/files/maw -xf -
          test ! -e stage/files/maw/ffmpeg
          curl --fail --location --silent --show-error --retry 3 -o cpython.tar.gz \
            'https://github.com/astral-sh/python-build-standalone/releases/download/20261124/cpython-3.11.18%2B20261124-x86_64-unknown-linux-gnu-install_only_stripped.tar.gz'
          printf '%s  %s\n' d873f435e58d396a18858d4f52a335f1abe8cea385cb9d411ec511f958249d54 cpython.tar.gz | sha256sum --check --strict
          tar -xf cpython.tar.gz -C stage/files/python --strip-components=1
          test -x stage/files/python/bin/python3
          ln -s ../python/bin/python3 stage/files/bin/python3
          cat > stage/files/bin/maw <<'EOF'
          #!/bin/sh
          set -eu
          export TMPDIR="$XDG_CACHE_HOME/maw-runtime-tmp"
          mkdir -p "$TMPDIR"
          exec /app/maw/AppRun "$@"
          EOF
          chmod +x stage/files/bin/maw
          desktop_dir=stage/files/share/applications
          icon_dir=stage/files/share/icons/hicolor/256x256/apps
          mkdir -p "$desktop_dir" "$icon_dir"
          sed -e 's/^Exec=.*/Exec=maw/' -e "s/^Icon=.*/Icon=$APP_ID/" \
            squashfs-root/MAW.desktop > "$desktop_dir/$APP_ID.desktop"
          cp squashfs-root/MAW.png "$icon_dir/$APP_ID.png"
          flatpak build-finish --command=maw --socket=x11 --share=ipc --share=network stage
          flatpak build-export repo stage
          flatpak build-bundle --runtime-repo="$FLATHUB" repo MAW-Freedesktop-x86_64.flatpak "$APP_ID"
      - name: Store test bundle
        uses: actions/upload-artifact@v6
        with:
          name: maw-freedesktop-x86_64
          path: MAW-Freedesktop-x86_64.flatpak
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  runtime:
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 28
    strategy:
      fail-fast: false
      matrix:
        feature: [ocr, local]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22.23.4'
          package-manager-cache: false
      - uses: actions/download-artifact@v7
        with:
          name: maw-freedesktop-x86_64
      - name: Install the bundle with the consumer runtime only
        run: |
          set -euo pipefail
          sudo apt-get update -q
          sudo apt-get install -y flatpak xvfb xauth dbus-x11 ffmpeg espeak-ng fonts-dejavu-core
          flatpak remote-add --user --if-not-exists flathub "$FLATHUB"
          flatpak install --user -y flathub "org.freedesktop.Platform//$PLATFORM_BRANCH"
          flatpak install --user -y --bundle MAW-Freedesktop-x86_64.flatpak
          if flatpak info --user "org.freedesktop.Sdk//$PLATFORM_BRANCH" >/dev/null 2>&1; then
            echo 'Consumer validation requires a Platform-only installation.' >&2
            exit 1
          fi
          flatpak info --user --show-commit "org.freedesktop.Platform//$PLATFORM_BRANCH"
          flatpak run --user --command=sh "$APP_ID" -ec '
            test ! -e /app/maw/ffmpeg
            test "$(command -v ffmpeg)" = /usr/bin/ffmpeg
            test "$(command -v ffprobe)" = /usr/bin/ffprobe
            ffmpeg -version
            ffprobe -version
          '
          flatpak run --user --command=/usr/bin/python3 "$APP_ID" --version
          flatpak run --user --command=python3 "$APP_ID" -c 'import ensurepip, sys, venv; print(sys.executable, sys.version); assert sys.version_info[:2] == (3, 11)'
      - name: Use the installed Launcher to install and exercise the CPU runtime
        run: dbus-run-session -- xvfb-run -a bash scripts/packaging/flatpak-validation/check-runtime.sh '${{ matrix.feature }}'
      - name: Preserve validation diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: maw-flatpak-${{ matrix.feature }}-evidence
          path: flatpak-evidence/
          if-no-files-found: warn
          retention-days: 7
